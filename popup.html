<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon.png">
    <title>Drive Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #e6e6e6;
            width: 400px;
            height: 520px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 13px;
        }
        .hidden { display: none !important; }

        .header {
            background: linear-gradient(180deg, #1f1f1f, #181818);
            padding: 12px 14px 10px;
            border-bottom: 1px solid #2c2c2c;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .title .dot.active {
            background: #4ade80;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid #3a3a3a;
            color: #c0c0c0;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .icon-btn:hover {
            background: #2c2c2c;
            border-color: #555;
            color: #fff;
        }
        .toggle-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .state-btn {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: all 0.2s ease;
        }
        .state-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .btn-on  { background-color: #16a34a; color: #fff; }
        .btn-on:hover:not(:disabled)  { background-color: #15803d; }
        .btn-off { background-color: #dc2626; color: #fff; }
        .btn-off:hover:not(:disabled) { background-color: #b91c1c; }
        .reload-btn {
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            color: #c0c0c0;
            cursor: pointer;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 13px;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .reload-btn:hover { background: #383838; color: #fff; }
        .reload-btn.hidden { display: none; }

        .body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        #downloadContainer {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        #downloadContainer::-webkit-scrollbar { width: 6px; }
        #downloadContainer::-webkit-scrollbar-track { background: transparent; }
        #downloadContainer::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        #downloadContainer::-webkit-scrollbar-thumb:hover { background: #444; }

        .video-item {
            background: #1f1f1f;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .video-item:hover { border-color: #3a3a3a; }
        .video-item.is-active { border-color: #2563eb; }

        button:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 1px;
        }
        .download-btn:focus-visible,
        .ctrl-btn:focus-visible,
        .icon-btn:focus-visible,
        .state-btn:focus-visible,
        .reload-btn:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 1px;
        }

        .video-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .video-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .video-title {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quality-badge {
            font-size: 10px;
            background: #2c2c2c;
            color: #ddd;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 600;
            border: 1px solid #3a3a3a;
        }
        .video-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .download-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.15s ease;
            white-space: nowrap;
        }
        .download-btn:hover:not(:disabled) { background: #1d4ed8; }
        .download-btn:disabled { background: #444; color: #aaa; cursor: not-allowed; }
        .download-btn.disabled-limit { background: #ca8a04; color: #fff; cursor: not-allowed; opacity: 0.7; }
        .download-btn.disabled-limit:hover { background: #ca8a04; }
        .download-btn.hidden { display: none !important; }

        .ctrl-btn {
            background: #2c2c2c;
            border: 1px solid #3a3a3a;
            color: #ddd;
            cursor: pointer;
            padding: 6px 9px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
        }
        .ctrl-btn:hover { background: #383838; color: #fff; }
        .ctrl-btn.hidden { display: none !important; }
        .pause-btn:hover  { background: #ca8a04; border-color: #ca8a04; color: #fff; }
        .resume-btn       { background: #16a34a; border-color: #16a34a; color: #fff; }
        .resume-btn:hover { background: #15803d; border-color: #15803d; }
        .cancel-btn:hover { background: #dc2626; border-color: #dc2626; color: #fff; }

        .progress-wrap { display: flex; flex-direction: column; gap: 4px; }
        .progress-wrap.hidden { display: none !important; }
        .progress-bar {
            height: 5px;
            background: #0d0d0d;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #4ade80);
            transition: width 0.1s linear;
        }
        .progress-fill.error     { background: #ef4444; }
        .progress-fill.completed { background: #4ade80; }
        .progress-text {
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-text .pp { color: #ddd; font-weight: 600; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            font-size: 12px;
            color: #666;
            line-height: 1.7;
        }
        .empty-state .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        #statusMessage {
            font-size: 11px;
            color: #888;
            padding: 6px 14px 8px;
            text-align: center;
            background: #181818;
            border-top: 1px solid #2c2c2c;
            flex-shrink: 0;
        }
        #statusMessage.hidden { display: none; }

        .alert-banner {
            background: linear-gradient(90deg, #b45309, #d97706);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            padding: 7px 12px;
            border-top: 1px solid #92400e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }
        .alert-banner.hidden { display: none; }
        .alert-banner .blink {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        .footer {
            padding: 6px 10px;
            background: #0a0a0a;
            border-top: 1px solid #2c2c2c;
            text-align: center;
            font-size: 10px;
            color: #777;
            flex-shrink: 0;
        }
        .footer a { color: #5b9bd5; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header hidden" id="header">
        <div class="title-row">
            <div class="title">
                <span class="dot" id="statusDot"></span>
                Drive Video Downloader
            </div>
            <div class="controls">
                <button class="icon-btn" id="clearHistoryBtn" title="Clear captured history (does not stop active downloads)">
                    Clear History
                </button>
            </div>
        </div>
        <div class="toggle-row">
            <button class="state-btn btn-on"  id="btnOn">ON</button>
            <button class="state-btn btn-off" id="btnOff" disabled>OFF</button>
            <button class="reload-btn hidden" id="reloadBtn" title="Reload current tab">↻ Reload</button>
        </div>
    </div>

    <div class="body">
        <div id="downloadContainer"></div>
        <div id="statusMessage" class="hidden"></div>
    </div>

    <div class="alert-banner hidden" id="downloadAlert">
        <span class="blink"></span>
        Download in progress — keep the source Drive tab open.
    </div>

    <div class="footer">
        Developer: <a href="https://github.com/md-abdullah-al-maruf" target="_blank">GitHub</a>
        &nbsp;•&nbsp; Version 2.0
    </div>

    <script src="popup.js"></script>
</body>
</html>
